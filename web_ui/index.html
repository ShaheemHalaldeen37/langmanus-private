<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangManus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <style>
    :root {
      --brand: #818cf8;
      --brand-dim: #4f46e5;
    }
    html, body { height: 100%; }
    body { background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

    /* Markdown output */
    .md-content h1, .md-content h2, .md-content h3 { font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
    .md-content h1 { font-size: 1.35em; color: #e2e8f0; }
    .md-content h2 { font-size: 1.15em; color: #cbd5e1; border-bottom: 1px solid #1e293b; padding-bottom: 0.3em; }
    .md-content h3 { font-size: 1.05em; color: #94a3b8; }
    .md-content p  { margin: 0.6em 0; line-height: 1.75; color: #cbd5e1; }
    .md-content ul, .md-content ol { margin: 0.5em 0 0.5em 1.4em; color: #cbd5e1; }
    .md-content li { margin: 0.2em 0; line-height: 1.6; }
    .md-content strong { color: #e2e8f0; }
    .md-content a { color: var(--brand); text-decoration: underline; }
    .md-content code:not(pre code) {
      background: #1e293b; color: #7dd3fc; padding: 1px 6px;
      border-radius: 4px; font-size: 0.85em; font-family: monospace;
    }
    .md-content pre {
      background: #0d1117; border: 1px solid #1e293b; border-radius: 8px;
      padding: 1em; margin: 0.8em 0; overflow-x: auto;
    }
    .md-content pre code { font-size: 0.82em; background: transparent; padding: 0; color: inherit; }
    .md-content blockquote {
      border-left: 3px solid var(--brand-dim); padding-left: 1em;
      margin: 0.5em 0; color: #94a3b8; font-style: italic;
    }
    .md-content table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.9em; }
    .md-content th { background: #1e293b; padding: 8px 12px; text-align: left; border: 1px solid #334155; }
    .md-content td { padding: 6px 12px; border: 1px solid #1e293b; }
    .md-content tr:nth-child(even) { background: #0f172a; }

    /* Thinking pulse */
    .thinking-dot { animation: blink 1.1s steps(1) infinite; }
    .thinking-dot:nth-child(2) { animation-delay: 0.35s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.7s; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Agent dot pulse */
    .badge-active { animation: pulseDot 1.5s ease-in-out infinite; }
    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(129,140,248,0.5); }
      50% { box-shadow: 0 0 0 4px rgba(129,140,248,0); }
    }

    /* Toggle */
    .toggle-checkbox:checked + .toggle-label { background: var(--brand-dim); }
    .toggle-checkbox:checked + .toggle-label .toggle-knob { transform: translateX(18px); }
    .toggle-label { transition: background 0.2s; }
    .toggle-knob { transition: transform 0.2s; }

    /* Textarea auto-grow */
    textarea { resize: none; field-sizing: content; max-height: 200px; }

    /* Fade-in */
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Cursor blink for streaming */
    .streaming-cursor::after {
      content: '▋'; color: var(--brand); animation: cursorBlink 0.8s steps(1) infinite;
    }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Agent section transitions */
    .agent-chevron { transition: transform 0.2s ease; }
    .agent-section + .agent-section { margin-top: 6px; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="flex items-center justify-between px-5 py-3 border-b border-gray-800 bg-gray-900/60 backdrop-blur-sm z-10 shrink-0">
    <div class="flex items-center gap-2.5">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="#818cf8" stroke-width="1.5"/>
        <path d="M8 14 L14 8 L20 14 L14 20 Z" fill="#818cf8" opacity="0.8"/>
        <circle cx="14" cy="14" r="3" fill="#818cf8"/>
      </svg>
      <span class="font-semibold text-lg tracking-tight text-white">LangManus</span>
    </div>
    <button
      onclick="newChat()"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-700 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Chat
    </button>
  </header>

  <!-- ── Messages ───────────────────────────────────────────── -->
  <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-8">

    <!-- Welcome screen -->
    <div id="welcome" class="max-w-2xl mx-auto text-center mt-16 fade-in">
      <div class="flex justify-center mb-5">
        <div class="w-16 h-16 rounded-2xl bg-indigo-900/40 border border-indigo-700/50 flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="13" stroke="#818cf8" stroke-width="1.5"/>
            <path d="M8 14 L14 8 L20 14 L14 20 Z" fill="#818cf8" opacity="0.8"/>
            <circle cx="14" cy="14" r="3" fill="#818cf8"/>
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">What can I help you with?</h1>
      <p class="text-gray-500 text-sm mb-8">Multi-agent AI — research, code, browse, and report</p>
      <div class="example-grid grid grid-cols-2 gap-3 text-left"></div>
    </div>

  </main>

  <!-- ── Input area ─────────────────────────────────────────── -->
  <footer class="shrink-0 border-t border-gray-800 bg-gray-900/60 backdrop-blur-sm px-4 pt-3 pb-4">
    <div class="max-w-3xl mx-auto">

      <!-- Toggles -->
      <div class="flex items-center gap-5 mb-3 px-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <div class="relative">
            <input id="deepThinking" type="checkbox" class="toggle-checkbox sr-only" />
            <div class="toggle-label w-9 h-5 bg-gray-700 rounded-full relative cursor-pointer">
              <div class="toggle-knob absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow"></div>
            </div>
          </div>
          <span class="text-xs text-gray-400">Deep Thinking</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <div class="relative">
            <input id="searchFirst" type="checkbox" class="toggle-checkbox sr-only" />
            <div class="toggle-label w-9 h-5 bg-gray-700 rounded-full relative cursor-pointer">
              <div class="toggle-knob absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow"></div>
            </div>
          </div>
          <span class="text-xs text-gray-400">Search Before Planning</span>
        </label>
        <span id="statusBadge" class="ml-auto text-xs text-gray-600 hidden">
          <span class="thinking-dot">●</span><span class="thinking-dot">●</span><span class="thinking-dot">●</span>
          <span class="ml-1" id="statusText">Working…</span>
        </span>
      </div>

      <!-- Textarea + Send -->
      <div class="flex gap-2 items-end">
        <div class="flex-1 relative">
          <textarea
            id="userInput"
            placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 pr-12 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 transition-colors leading-relaxed min-h-[48px]"
            rows="1"
          ></textarea>
        </div>
        <button
          id="sendBtn"
          onclick="handleSend()"
          class="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-gray-700 disabled:cursor-not-allowed flex items-center justify-center transition-colors shrink-0"
        >
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <svg id="stopIcon" width="16" height="16" viewBox="0 0 24 24" fill="white" class="hidden">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>
      </div>
      <p class="text-center text-xs text-gray-700 mt-2">LangManus may make mistakes. Verify important information.</p>
    </div>
  </footer>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
// Use a relative URL when served by the API server itself; fall back to
// localhost:8000 when the file is opened directly from disk.
const API_URL = location.protocol.startsWith('http')
  ? '/api/chat/stream'
  : 'http://localhost:8000/api/chat/stream';

const EXAMPLE_QUERIES = [
  { icon: '📊', title: 'Compare populations', query: 'Compare the populations of Tokyo and New York with latest data' },
  { icon: '📈', title: 'Stock analysis',      query: "Analyze NVIDIA's stock performance over the last 3 months" },
  { icon: '🔬', title: 'Research topic',      query: 'Research the latest developments in quantum computing in 2025' },
  { icon: '🐍', title: 'Write & run code',    query: 'Write a Python script to generate a Fibonacci sequence up to 1000' },
  { icon: '🌐', title: 'Browse the web',      query: 'Use the browser to open news.ycombinator.com and summarize the top 5 stories' },
  { icon: '🛒', title: 'Look up a product',   query: 'Use the browser to find the current price of the Raspberry Pi 5 on raspberrypi.com' },
];

function renderExamples() {
  document.querySelectorAll('.example-grid').forEach(grid => {
    grid.innerHTML = EXAMPLE_QUERIES.map(ex => `
      <button onclick="useExample(this)" class="example-btn p-4 rounded-xl border border-gray-800 bg-gray-900/60 hover:border-indigo-600 hover:bg-indigo-900/20 transition-all text-left group">
        <div class="text-sm font-medium text-gray-200 mb-1 group-hover:text-indigo-300">${ex.icon} ${ex.title}</div>
        <div class="text-xs text-gray-500">${ex.query}</div>
      </button>
    `).join('');
  });
}

const AGENT_META = {
  coordinator: { label: 'Coordinator', icon: '🧭', border: 'border-indigo-800/50', text: 'text-indigo-300',  dot: 'bg-indigo-400'  },
  planner:     { label: 'Planner',     icon: '📋', border: 'border-violet-800/50', text: 'text-violet-300', dot: 'bg-violet-400'  },
  supervisor:  { label: 'Supervisor',  icon: '👁️',  border: 'border-blue-800/50',   text: 'text-blue-300',   dot: 'bg-blue-400'    },
  researcher:  { label: 'Researcher',  icon: '🔍', border: 'border-emerald-800/50',text: 'text-emerald-300',dot: 'bg-emerald-400' },
  coder:       { label: 'Coder',       icon: '💻', border: 'border-amber-800/50',  text: 'text-amber-300',  dot: 'bg-amber-400'   },
  browser:     { label: 'Browser',     icon: '🌐', border: 'border-cyan-800/50',   text: 'text-cyan-300',   dot: 'bg-cyan-400'    },
  reporter:    { label: 'Reporter',    icon: '📄', border: 'border-rose-800/50',   text: 'text-rose-300',   dot: 'bg-rose-400'    },
};
const DEFAULT_META = { label: 'Agent', icon: '🤖', border: 'border-gray-800/50', text: 'text-gray-300', dot: 'bg-gray-400' };

// ── State ───────────────────────────────────────────────────────────────────
let isRunning         = false;
let abortCtrl         = null;
let messages          = [];
let toolCallEls       = {};
let workflowFinalized = false;

// Per-agent tracking
let currentAgentName    = null;
let currentAgentSection = null;
let agentRawContent     = {};
let agentThinkRaw       = {};

// Current section DOM refs — updated on each startAgent call
let curBlock, curAgentsContainer, curContentEl, curToolsEl, curThinkEl, curThinkBody;

let scrollPending = false;

marked.setOptions({ breaks: true, gfm: true });

// ── Helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const messagesEl = $('messages');

function scrollBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

function hideWelcome() {
  const w = $('welcome');
  if (w) w.remove();
}

function setRunning(val) {
  isRunning = val;
  $('sendBtn').disabled = false;
  $('userInput').disabled = val;
  $('statusBadge').classList.toggle('hidden', !val);
  $('sendIcon').classList.toggle('hidden', val);
  $('stopIcon').classList.toggle('hidden', !val);
}

function setStatus(text) {
  $('statusText').textContent = text;
}

// ── Message rendering ────────────────────────────────────────────────────────
function addUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'max-w-3xl mx-auto flex justify-end fade-in';
  el.innerHTML = `
    <div class="max-w-[80%] bg-indigo-900/50 border border-indigo-800/50 rounded-2xl rounded-tr-sm px-4 py-3 text-sm text-gray-100 leading-relaxed whitespace-pre-wrap">${escapeHtml(text)}</div>
  `;
  messagesEl.appendChild(el);
  scrollBottom();
}

function createResponseBlock() {
  const wrap = document.createElement('div');
  wrap.className = 'max-w-3xl mx-auto fade-in';
  wrap.innerHTML = `
    <div class="flex items-start gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-900/60 border border-indigo-700/50 flex items-center justify-center shrink-0 mt-1">
        <svg width="16" height="16" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" stroke="#818cf8" stroke-width="1.5"/>
          <path d="M8 14 L14 8 L20 14 L14 20 Z" fill="#818cf8" opacity="0.8"/>
          <circle cx="14" cy="14" r="3" fill="#818cf8"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0 agents-container"></div>
    </div>
  `;
  messagesEl.appendChild(wrap);
  curBlock           = wrap;
  curAgentsContainer = wrap.querySelector('.agents-container');
  scrollBottom();
}

// ── Agent sections ────────────────────────────────────────────────────────────
function startAgent(name) {
  const meta = AGENT_META[name] || { ...DEFAULT_META, label: name };

  // Flush any buffered stream content belonging to the previous agent
  flushDelta();

  // If workflow was already finalized optimistically (e.g. reporter ended), resume
  if (workflowFinalized) {
    workflowFinalized = false;
    setRunning(true);
  }

  // Finalize and collapse the previously active section
  if (currentAgentSection) {
    _finalizeSectionContent(currentAgentName);
    _collapseSection(currentAgentSection);
  }

  currentAgentName      = name;
  currentAgentSection   = null;
  agentRawContent[name] = '';
  agentThinkRaw[name]   = '';

  const section = document.createElement('div');
  section.className = `agent-section border ${meta.border} rounded-xl overflow-hidden`;
  section.dataset.agent = name;
  section.innerHTML = `
    <div class="agent-header flex items-center gap-2 px-3 py-2.5 bg-gray-900/50 cursor-pointer select-none hover:bg-gray-800/40 transition-colors"
         onclick="toggleAgentSection(this.closest('.agent-section'))">
      <svg class="agent-chevron w-3 h-3 text-gray-500 shrink-0" style="transform:rotate(180deg)"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <span class="text-base leading-none">${meta.icon}</span>
      <span class="text-xs font-semibold ${meta.text}">${meta.label}</span>
      <span class="agent-dot w-1.5 h-1.5 rounded-full ${meta.dot} ml-0.5 badge-active shrink-0"></span>
      <span class="agent-status text-xs text-gray-500 ml-auto">working…</span>
    </div>
    <div class="agent-body px-3 pb-3 pt-2.5 space-y-2.5 border-t ${meta.border}">
      <div class="think-section hidden">
        <button class="think-toggle flex items-center gap-1.5 text-xs text-gray-500 hover:text-gray-300 transition-colors"
                onclick="toggleThink(this)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="think-chevron transition-transform">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          <span class="think-label">Thinking…</span>
        </button>
        <div class="think-body hidden mt-2 p-3 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-500 font-mono leading-relaxed max-h-48 overflow-y-auto whitespace-pre-wrap"></div>
      </div>
      <div class="tools-section hidden">
        <div class="flex items-center gap-1.5 text-xs text-gray-500 mb-1.5 cursor-pointer hover:text-gray-300 transition-colors select-none"
             onclick="toggleTools(this)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tools-chevron transition-transform">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          <span class="tools-label">🔧 Tool Calls</span>
        </div>
        <div class="tools-body space-y-1.5 hidden"></div>
      </div>
      <div class="content-area md-content text-sm leading-relaxed streaming-cursor"></div>
    </div>
  `;

  curAgentsContainer.appendChild(section);
  currentAgentSection = section;

  curContentEl = section.querySelector('.content-area');
  curToolsEl   = section.querySelector('.tools-section');
  curThinkEl   = section.querySelector('.think-section');
  curThinkBody = section.querySelector('.think-body');

  setStatus(`${meta.icon} ${meta.label} working…`);
  scrollBottom();
}

function endAgent(name) {
  if (!currentAgentSection || currentAgentSection.dataset.agent !== name) return;
  flushDelta();
  const dot    = currentAgentSection.querySelector('.agent-dot');
  const status = currentAgentSection.querySelector('.agent-status');
  if (dot)    { dot.classList.remove('badge-active'); dot.classList.add('opacity-0'); }
  if (status) status.textContent = 'done';

  // Render markdown immediately when the agent ends (don't wait for end_of_workflow)
  _finalizeSectionContent(name);

  // Reporter is the last user-visible agent. The subsequent supervisor FINISH call
  // is invisible — clean up the running state now so the user isn't left waiting.
  if (name === 'reporter' && !workflowFinalized) {
    workflowFinalized = true;
    messages.push({ role: 'assistant', content: agentRawContent[name] || '' });
    setRunning(false);
  }
}

function _finalizeSectionContent(name) {
  if (!currentAgentSection) return;
  const contentEl = currentAgentSection.querySelector('.content-area');
  if (contentEl && !contentEl.dataset.finalized) {
    contentEl.dataset.finalized = '1';
    contentEl.classList.remove('streaming-cursor');
    const raw = (agentRawContent[name] || '')
      .replace(/<think>[\s\S]*?(<\/think>|$)/g, '').trim();
    if (raw) {
      contentEl.innerHTML = marked.parse(raw);
      contentEl.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    }
  }
  // Collapse thinking block if it has content
  const thinkRaw = agentThinkRaw[name] || '';
  if (thinkRaw) {
    const label   = currentAgentSection.querySelector('.think-label');
    const body    = currentAgentSection.querySelector('.think-body');
    const chevron = currentAgentSection.querySelector('.think-chevron');
    if (label)   label.textContent = `Thought (${thinkRaw.length} chars)`;
    if (body)    body.classList.add('hidden');
    if (chevron) chevron.style.transform = '';
  }
}

function _collapseSection(section) {
  if (!section) return;
  const body    = section.querySelector('.agent-body');
  const chevron = section.querySelector('.agent-chevron');
  if (body)    body.classList.add('hidden');
  if (chevron) chevron.style.transform = '';
}

function toggleAgentSection(section) {
  const body    = section.querySelector('.agent-body');
  const chevron = section.querySelector('.agent-chevron');
  const open    = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  chevron.style.transform = open ? '' : 'rotate(180deg)';
}

// ── Thinking ─────────────────────────────────────────────────────────────────
function appendReasoning(text) {
  if (!currentAgentName) return;
  agentThinkRaw[currentAgentName] = (agentThinkRaw[currentAgentName] || '') + text;
  if (!curThinkEl || !curThinkBody) return;
  curThinkEl.classList.remove('hidden');
  curThinkBody.textContent = agentThinkRaw[currentAgentName];
  if (curThinkBody.classList.contains('hidden')) {
    curThinkBody.classList.remove('hidden');
    curThinkEl.querySelector('.think-chevron').style.transform = 'rotate(180deg)';
  }
}

function toggleThink(btn) {
  const body    = btn.closest('.think-section').querySelector('.think-body');
  const chevron = btn.querySelector('.think-chevron');
  const open    = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  chevron.style.transform = open ? '' : 'rotate(180deg)';
}

// ── Tool calls ───────────────────────────────────────────────────────────────
function addToolCall(id, name, input) {
  if (!curToolsEl) return;
  curToolsEl.classList.remove('hidden');
  const body  = curToolsEl.querySelector('.tools-body');
  const count = body.querySelectorAll('.tool-card').length + 1;
  curToolsEl.querySelector('.tools-label').textContent = `🔧 Tool Calls (${count})`;

  const inputStr = typeof input === 'object' ? JSON.stringify(input, null, 2) : String(input ?? '');

  const card = document.createElement('div');
  card.className = 'tool-card rounded-lg border border-gray-800 overflow-hidden text-xs';
  card.innerHTML = `
    <div class="tool-header flex items-center justify-between px-3 py-2 bg-gray-900 cursor-pointer hover:bg-gray-800/70 transition-colors">
      <div class="flex items-center gap-2 font-medium text-gray-300">
        <span class="text-amber-400">🔧</span>
        <code class="text-amber-300">${escapeHtml(name)}</code>
      </div>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           class="tool-chevron text-gray-600 transition-transform">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div class="tool-body hidden">
      <div class="px-3 py-2 border-t border-gray-800 bg-gray-950">
        <p class="text-gray-600 uppercase tracking-wide text-[10px] mb-1">Input</p>
        <pre class="text-gray-400 whitespace-pre-wrap break-all">${escapeHtml(inputStr)}</pre>
      </div>
      <div class="tool-result px-3 py-2 border-t border-gray-800 bg-gray-950 hidden">
        <p class="text-gray-600 uppercase tracking-wide text-[10px] mb-1">Result</p>
        <pre class="result-text text-gray-400 whitespace-pre-wrap break-all max-h-32 overflow-y-auto"></pre>
      </div>
    </div>
  `;

  card.querySelector('.tool-header').addEventListener('click', () => {
    const tbody   = card.querySelector('.tool-body');
    const chevron = card.querySelector('.tool-chevron');
    const open    = !tbody.classList.contains('hidden');
    tbody.classList.toggle('hidden', open);
    chevron.style.transform = open ? '' : 'rotate(180deg)';
  });

  body.appendChild(card);
  toolCallEls[id] = card;
  scrollBottom();
}

function setToolResult(id, result) {
  const card = toolCallEls[id];
  if (!card) return;
  const resultSection = card.querySelector('.tool-result');
  const resultText    = card.querySelector('.result-text');
  const truncated     = typeof result === 'string' && result.length > 800
    ? result.slice(0, 800) + '\n… (truncated)' : (result ?? '');
  resultSection.classList.remove('hidden');
  resultText.textContent = truncated;
}

function toggleTools(el) {
  const section = el.closest('.tools-section');
  const body    = section.querySelector('.tools-body');
  const chevron = el.querySelector('.tools-chevron');
  const open    = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  chevron.style.transform = open ? '' : 'rotate(180deg)';
}

// ── Content streaming ─────────────────────────────────────────────────────────
// Models like qwen3 emit <think>…</think> inline in the content stream.
// Route those segments to the Thinking section instead of the visible output.
const THINK_OPEN  = '<think>';
const THINK_CLOSE = '</think>';
let thinkMode = false;
let thinkBuf  = '';

function _tagPrefixLen(s, tag) {
  const max = Math.min(s.length, tag.length - 1);
  for (let k = max; k > 0; k--) {
    if (tag.startsWith(s.slice(s.length - k))) return k;
  }
  return 0;
}

function processDelta(text) {
  thinkBuf += text;
  while (true) {
    const tag = thinkMode ? THINK_CLOSE : THINK_OPEN;
    const out = thinkMode ? appendReasoning : appendContent;
    const idx = thinkBuf.indexOf(tag);
    if (idx !== -1) {
      if (idx > 0) out(thinkBuf.slice(0, idx));
      thinkBuf  = thinkBuf.slice(idx + tag.length);
      thinkMode = !thinkMode;
      continue;
    }
    // Flush everything except a possible partial tag at the end of the buffer
    const keep  = _tagPrefixLen(thinkBuf, tag);
    const flush = thinkBuf.slice(0, thinkBuf.length - keep);
    if (flush) out(flush);
    thinkBuf = keep ? thinkBuf.slice(thinkBuf.length - keep) : '';
    return;
  }
}

function flushDelta() {
  if (thinkBuf) (thinkMode ? appendReasoning : appendContent)(thinkBuf);
  thinkBuf  = '';
  thinkMode = false;
}

function appendContent(text) {
  if (!currentAgentName || !curContentEl) return;
  agentRawContent[currentAgentName] = (agentRawContent[currentAgentName] || '') + text;
  curContentEl.textContent = agentRawContent[currentAgentName];
  throttledScroll();
}

function finalizeContent() {
  if (currentAgentName && currentAgentSection) {
    _finalizeSectionContent(currentAgentName);
  }
  scrollPending = false;
  scrollBottom();
}

function throttledScroll() {
  if (!scrollPending) {
    scrollPending = true;
    requestAnimationFrame(() => { scrollPending = false; scrollBottom(); });
  }
}

// ── SSE streaming ─────────────────────────────────────────────────────────────
async function streamWorkflow(userText) {
  abortCtrl = new AbortController();

  let response;
  try {
    response = await fetch(API_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      signal:  abortCtrl.signal,
      body: JSON.stringify({
        messages: messages.map(m => ({ role: m.role, content: m.content })),
        debug: false,
        deep_thinking_mode: $('deepThinking').checked,
        search_before_planning: $('searchFirst').checked,
      }),
    });
  } catch (err) {
    if (err.name !== 'AbortError') appendContent(`⚠️ Connection failed: ${err.message}`);
    return;
  }

  if (!response.ok) {
    appendContent(`⚠️ Server error ${response.status}`);
    return;
  }

  const reader  = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer    = '';

  while (true) {
    let chunk;
    try { chunk = await reader.read(); } catch { break; }
    const { done, value } = chunk;
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();

    for (const part of parts) {
      let etype = '', edata = '';
      for (const line of part.split('\n')) {
        if (line.startsWith('event:')) etype = line.slice(6).trim();
        else if (line.startsWith('data:')) edata = line.slice(5).trim();
      }
      if (!etype || !edata) continue;
      let parsed;
      try { parsed = JSON.parse(edata); } catch { continue; }
      handleEvent(etype, parsed);
    }
  }
}

function handleEvent(type, data) {
  switch (type) {
    case 'start_of_workflow':
      setStatus('Starting…');
      break;

    case 'start_of_agent':
      startAgent(data.agent_name);
      break;

    case 'end_of_agent':
      endAgent(data.agent_name);
      break;

    case 'start_of_llm':
    case 'end_of_llm':
      break;

    case 'message': {
      const delta = data.delta || {};
      if (delta.reasoning_content) appendReasoning(delta.reasoning_content);
      if (delta.content)           processDelta(delta.content);
      break;
    }

    case 'tool_call':
      addToolCall(data.tool_call_id, data.tool_name, data.tool_input);
      break;

    case 'tool_call_result':
      setToolResult(data.tool_call_id, data.tool_result);
      break;

    case 'end_of_workflow':
      if (!workflowFinalized) {
        workflowFinalized = true;
        finalizeContent();
        messages.push({ role: 'assistant', content: agentRawContent[currentAgentName] || '' });
        setRunning(false);
      }
      break;
  }
}

// ── Send / Stop ───────────────────────────────────────────────────────────────
async function handleSend() {
  if (isRunning) {
    abortCtrl?.abort();
    finalizeContent();
    setRunning(false);
    return;
  }

  const input = $('userInput');
  const text  = input.value.trim();
  if (!text) return;

  hideWelcome();
  input.value = '';
  input.style.height = 'auto';

  // Reset all state
  toolCallEls         = {};
  scrollPending       = false;
  workflowFinalized   = false;
  currentAgentName    = null;
  currentAgentSection = null;
  agentRawContent     = {};
  agentThinkRaw       = {};
  thinkMode           = false;
  thinkBuf            = '';
  curBlock = curAgentsContainer = curContentEl = curToolsEl = curThinkEl = curThinkBody = null;

  messages.push({ role: 'user', content: text });
  addUserMessage(text);
  createResponseBlock();
  setRunning(true);

  await streamWorkflow(text);

  // Fallback cleanup if end_of_workflow was not sent (non-handoff coordinator response)
  if (!workflowFinalized) {
    workflowFinalized = true;
    finalizeContent();
    messages.push({ role: 'assistant', content: agentRawContent[currentAgentName] || '' });
    setRunning(false);
  }
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
$('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ── Sanitize HTML ─────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
